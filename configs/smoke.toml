# Smallest runnable configuration; used to verify the pipeline end-to-end
# (PLAN.md Milestone 1, Step 0: "submit one toy SLURM job end-to-end").
# Fields are added to this file as ExperimentConfig grows.

name = "smoke"
seed = 0
dataset = "foodseg103"
split = "test"
model = "open_clip/ViT-B-32-quickgelu/openai"
removal = "blur"
prompt_template = "a photo of {}, a type of food."
image_size = 224
max_players = 7
min_area_fraction = 0.005
blur_radius = 12.0
background_mode = "player"
interaction_order = 2

# A 20-image prefix, not a sample: enough to rehearse the array mechanics
# end to end on real images, never enough to report anything.
max_images = 20

notes = "Toy configuration for infrastructure checks, not for reported results."
