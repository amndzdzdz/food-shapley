# There is no CI. These hooks are the only automated gate on the repository,
# which has two consequences worth knowing:
#
#   1. mypy, pytest and shellcheck are filtered by file type, so a commit that
#      touches only Markdown runs neither the type check nor the tests.
#   2. The pytest hook excludes `slow`, so slow tests never run automatically.
#
# Run `uv run pytest -m "not gpu"` by hand before anything that matters.
minimum_pre_commit_version: "4.0.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Keep this rev in sync with the ruff version pinned in uv.lock.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # The SLURM scripts cannot be executed off the cluster, so static checking is
  # the only safety net they get. ``types: [file]`` plus an explicit pattern,
  # because .slurm is not recognised as a shell file by extension.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--shell=bash]
        types: [file]
        files: ^slurm/.*\.(sh|slurm)$

  # mypy and pytest run through uv against the project environment, so they see
  # exactly the dependencies declared in uv.lock rather than an isolated
  # pre-commit virtualenv with a second, drifting set of pins. `gpu` tests are
  # excluded because no GPU is assumed; `slow` because a commit hook that takes
  # minutes stops being run.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: uv run --frozen mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true

      - id: pytest
        name: pytest (excluding slow tests)
        entry: uv run --frozen pytest -q -m "not slow and not gpu"
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
