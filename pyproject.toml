[project]
name = "food-shapley"
version = "0.1.0"
description = "Exact Shapley values and interactions over food-ingredient segments to study compositional vision-language recognition"
readme = "README.md"
# shapiq >= 1.5 requires Python >= 3.12, and shapiq is the core method of this
# project, so 3.12 is the floor. (shapiq 1.4.1 was the last release supporting
# 3.11; pinning to it to keep 3.11 would mean an old version of the one
# dependency the method rests on.)
requires-python = ">=3.12"
license = { text = "MIT" }

# Each dependency is here because code in this repository imports it.
dependencies = [
    # The method itself: exact Shapley values, k-SII and Möbius transforms
    # (PLAN.md steps 3-5).
    "shapiq>=1.7",
    # Model inference backend for CLIP and, later, the Milestone 2 model
    # families.
    "torch>=2.4",
    # CLIP implementation. Chosen over transformers because the configuration
    # already names open_clip checkpoints and because Week 2's token-dropping
    # removal operator (PLAN.md step 6) needs access to ViT internals.
    "open-clip-torch>=3.0",
    # Coalition encoding, masks, and the stored .npz value arrays.
    "numpy>=2.0",
    # FoodSeg103 access; see docs/datasets.md.
    "datasets>=4.0",
    # Imported directly, not only via datasets: load_dataset reads the parquet
    # shards and nothing else, so the mirror's top-level id2label.json has to be
    # fetched by hand to pin the ingredient names to the same revision.
    "huggingface-hub>=0.30",
    # Image and segmentation-mask handling, including the blur removal operator.
    "pillow>=11.0",
]

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.14",
    # Already present via open-clip-torch, but declared because the segment
    # geometry test asserts byte-equality against torchvision's own Resize and
    # CenterCrop -- that comparison is the test, so the dependency is explicit.
    "torchvision>=0.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/food_shapley"]

[tool.uv]
package = true

# --------------------------------------------------------------------------- #
# pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = []
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "integration: exercises several components together; slower, may touch the filesystem",
    "slow: takes more than a few seconds; excluded from the pre-commit hook",
    "gpu: requires a GPU / cluster node; excluded from the pre-commit hook",
]
filterwarnings = ["error"]

# --------------------------------------------------------------------------- #
# Ruff (linter + formatter)
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (undefined names, unused imports)
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "RET",  # flake8-return
    "PTH",  # prefer pathlib
    "ARG",  # unused arguments
    "TID",  # tidy imports
    "NPY",  # numpy-specific rules
    "PD",   # pandas-specific rules
    "RUF",  # ruff-specific rules
    "ANN",  # type annotations
    "D",    # pydocstyle
    "S",    # flake8-bandit (security)
    "PT",   # flake8-pytest-style
    "N",    # pep8-naming
]
ignore = [
    "D104",  # missing docstring in public package
    "D107",  # missing docstring in __init__ (documented at class level)
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # asserts are the point of a test
    "D100",  # module docstrings not required for tests
    "D103",  # test function docstrings not required
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.format]
docstring-code-format = true

# --------------------------------------------------------------------------- #
# mypy (strict)
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
warn_unused_configs = true
disallow_any_unimported = true
disallow_any_explicit = false  # narrow, documented Any is allowed at JSON boundaries
no_implicit_reexport = true
pretty = true

# Untyped third-party packages are opted out here, one at a time, with a reason.
# shapiq, torch, numpy and pillow all ship py.typed and are checked normally.

# datasets ships no py.typed marker. Only food_shapley.download imports it, and
# it keeps datasets types out of its public signatures.
[[tool.mypy.overrides]]
module = ["datasets.*"]
ignore_missing_imports = true
follow_untyped_imports = true
# Without a py.typed marker datasets has no explicit re-export list, so
# datasets.load_dataset looks like a private import to the global
# no_implicit_reexport rule. Relaxed for this module only.
implicit_reexport = true

# torchvision ships no py.typed marker either. It is imported only by
# tests/unit/test_segments.py, which asserts that our resize-and-crop geometry
# matches torchvision's byte for byte; no source module imports it. Its own
# bodies are deliberately not followed -- the transforms are untyped, and
# calling them is the entire point of that test.
[[tool.mypy.overrides]]
module = ["torchvision.*"]
ignore_missing_imports = true

# open_clip ships no py.typed marker. Only food_shapley.scoring imports it, and
# only for create_model_and_transforms / get_tokenizer; everything the rest of
# the codebase sees is typed by ClipScorer's own signatures.
[[tool.mypy.overrides]]
module = ["open_clip.*"]
ignore_missing_imports = true
