name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      # Version comes from .python-version, so CI and local environments cannot drift.
      - name: Set up Python
        run: uv python install

      # NOTE: this installs the CUDA build of torch -- ~4 GB of nvidia/* and
      # triton wheels that a CPU runner cannot use. It is expected to work on
      # ubuntu-latest but is slow, and is the first thing to change if CI
      # starts running out of disk or time. The fix is a CPU-only torch index
      # selected by extra; it is not done here because it changes how everyone
      # installs the project, which is a decision, not a cleanup.
      - name: Install dependencies from the lockfile
        run: uv sync --frozen --all-groups

      - name: Ruff lint
        run: uv run --frozen ruff check .

      - name: Ruff format check
        run: uv run --frozen ruff format --check .

      - name: mypy (strict)
        run: uv run --frozen mypy

      - name: pytest
        run: uv run --frozen pytest -m "not gpu"

      # The SLURM scripts can never run in CI, so lint them at least.
      - name: shellcheck (SLURM scripts)
        run: shellcheck --shell=bash slurm/*.sh slurm/*.slurm
