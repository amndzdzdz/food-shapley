name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      # Version comes from .python-version, so CI and local environments cannot drift.
      - name: Set up Python
        run: uv python install

      - name: Install dependencies from the lockfile
        run: uv sync --frozen --all-groups

      - name: Ruff lint
        run: uv run --frozen ruff check .

      - name: Ruff format check
        run: uv run --frozen ruff format --check .

      - name: mypy (strict)
        run: uv run --frozen mypy

      - name: pytest
        run: uv run --frozen pytest -m "not gpu"

      # The SLURM scripts can never run in CI, so lint them at least.
      - name: shellcheck (SLURM scripts)
        run: shellcheck --shell=bash slurm/*.sh slurm/*.slurm
